// ===== ИСПРАВЛЕНИЕ: облака без ctx.filter = 'blur()'.
// Мягкость достигается несколькими слоями полупрозрачных эллипсов,
// что на порядок дешевле, чем blur-свёртка в canvas.
const cloudCache = { red: null, blue: null, w: 0, h: 0 };

function buildCloudLayers(theme, skyH){
  const isRed = theme.clouds === 'red';
  const layers = [];
  const cloudCount = 14;
  for (let i = 0; i < cloudCount; i++) {
    const seed = i * 137.5;
    const baseX = (Math.sin(seed) * 0.5 + 0.5);
    const baseY = (Math.cos(seed * 1.3) * 0.5 + 0.5);
    const cw = W * (0.25 + (Math.sin(seed * 2.1) * 0.5 + 0.5) * 0.35);
    const ch = skyH * (0.06 + (Math.cos(seed * 1.7) * 0.5 + 0.5) * 0.08);
    const phase = i;
    layers.push({
      x: baseX, y: baseY, w: cw, h: ch, phase,
      drift: Math.sin(seed) * 0.5 + 0.5,
      alpha: isRed ? 0.55 : 0.6
    });
  }
  return layers;
}

function drawProceduralClouds(horizon, shakeX, shakeY, theme){
  if (!theme.clouds) return;
  const skyH = horizon;
  if (skyH <= 0) return;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  const isRed = theme.clouds === 'red';
  const t = performance.now() * 0.00003;

  // Базовое свечение (солнце/луна). Кэшируем слои.
  if (isRed) {
    const sunX = W * 0.5;
    const sunY = skyH * 0.5;
    const grad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, W * 0.5);
    grad.addColorStop(0, 'rgba(200,20,20,0.55)');
    grad.addColorStop(0.15, 'rgba(120,0,0,0.4)');
    grad.addColorStop(0.5, 'rgba(40,0,0,0.2)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, skyH);
  } else {
    const sunX = W * 0.5;
    const sunY = skyH * 0.55;
    const grad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, W * 0.45);
    grad.addColorStop(0, 'rgba(30,100,180,0.5)');
    grad.addColorStop(0.2, 'rgba(10,50,100,0.35)');
    grad.addColorStop(0.6, 'rgba(0,10,30,0.15)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, skyH);
  }

  // Кэш слоёв облаков — пересоздаём только при изменении размеров.
  const key = isRed ? 'red' : 'blue';
  if (cloudCache[key] === null ||
      cloudCache.w !== W ||
      cloudCache.h !== skyH) {
    cloudCache[key] = buildCloudLayers(theme, skyH);
    cloudCache.w = W;
    cloudCache.h = skyH;
  }
  const layers = cloudCache[key];

  // Три слоя для мягких краёв вместо blur.
  for (let s = 0; s < 3; s++) {
    const expand = 1 + s * 0.18;
    const alpha = layers[0].alpha * (0.55 - s * 0.15);
    ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
    ctx.beginPath();
    for (let i = 0; i < layers.length; i++) {
      const L = layers[i];
      const drift = Math.sin(t * 10 + L.phase) * 0.03;
      const cx = ((L.x + drift + 1) % 1) * W;
      const cy = L.y * skyH;
      const cw = L.w * expand;
      const ch = L.h * expand;
      ctx.moveTo(cx + cw, cy);
      ctx.ellipse(cx, cy, cw, ch, 0, 0, Math.PI * 2);
    }
    ctx.fill();
  }

  ctx.restore();
}

// ===== ИСПРАВЛЕНИЕ: аспекты кэшируются, чтобы не дёргать naturalWidth/Height в горячем цикле.
const ASPECT_CACHE = {};
const DEFAULT_ASPECT = 0.45;
function getAspect(src){
  if (ASPECT_CACHE[src] !== undefined) return ASPECT_CACHE[src];
  const img = preloads[src];
  if (img && img.naturalHeight > 0) {
    ASPECT_CACHE[src] = img.naturalWidth / img.naturalHeight;
    return ASPECT_CACHE[src];
  }
  return DEFAULT_ASPECT;
}
function isLoaded(src){
  const img = preloads[src];
  return img && img.complete && img.naturalWidth > 0;
}
// При загрузке изображения обновляем кэш аспекта
Object.values(preloads).forEach(img => {
  if (img.complete) {
    if (img.naturalHeight > 0) ASPECT_CACHE[img.src] = img.naturalWidth / img.naturalHeight;
  } else {
    img.addEventListener('load', () => {
      if (img.naturalHeight > 0) ASPECT_CACHE[img.src] = img.naturalWidth / img.naturalHeight;
    });
  }
});

const joy = { active:false, id:null, baseX:0, baseY:0, x:0, y:0, R:90, r:42, vx:0, vy:0 };
cv.addEventListener('touchstart', e=>{ for (const t of e.changedTouches){ if (t.clientX < W*0.45 && t.clientY > H*0.25 && !joy.active){ joy.active=true; joy.id=t.identifier; joy.baseX=t.clientX; joy.baseY=t.clientY; joy.x=t.clientX; joy.y=t.clientY; } } }, {passive:false});
cv.addEventListener('touchmove', e=>{ for (const t of e.changedTouches){ if (t.identifier === joy.id){ const dx=t.clientX-joy.baseX, dy=t.clientY-joy.baseY; const d=Math.hypot(dx,dy), max=joy.R; if (d>max){ joy.x=joy.baseX+dx/d*max; joy.y=joy.baseY+dy/d*max; } else { joy.x=t.clientX; joy.y=t.clientY; } joy.vx=(joy.x-joy.baseX)/max; joy.vy=(joy.y-joy.baseY)/max; } } }, {passive:false});
cv.addEventListener('touchend', e=>{ for (const t of e.changedTouches){ if (t.identifier === joy.id){ joy.active=false; joy.id=null; joy.vx=0; joy.vy=0; } } }, {passive:false});
let lookId = null, lookX = 0, lookY = 0;
cv.addEventListener('touchstart', e=>{ for (const t of e.changedTouches){ if (t.clientX > W*0.45 && lookId === null){ lookId=t.identifier; lookX=t.clientX; lookY=t.clientY; } } }, {passive:false});
cv.addEventListener('touchmove', e=>{ for (const t of e.changedTouches){ if (t.identifier === lookId){ const dx=t.clientX-lookX; const dy=t.clientY-lookY; player.dir += dx*0.006; pitchPixels -= dy*1.5; const pmax=updatePitchMax(); pitchPixels=Math.max(-pmax,Math.min(pmax,pitchPixels)); lookX=t.clientX; lookY=t.clientY; } } }, {passive:false});
cv.addEventListener('touchend', e=>{ for (const t of e.changedTouches){ if (t.identifier === lookId) lookId=null; } }, {passive:false});
cv.addEventListener('wheel', e=>{ e.preventDefault(); pitchPixels -= e.deltaY*0.5; const pmax=updatePitchMax(); pitchPixels=Math.max(-pmax,Math.min(pmax,pitchPixels)); }, {passive:false});

  el.addEventListener('mousedown',  e=>{ e.preventDefault(); e.stopPropagation(); fn(); });
}

onPress(btns.dash, ()=>{
  if (transitionActive) return;
  if (player.frozenTimer > 0) return;
  if (player.dashTimer > 0) {
    player.dashSpeed = 24.0;
    player.dashTimer = Math.max(player.dashTimer, 0.25);
    player.dashAnim = 0.35;
  } else {
    player.dashSpeed = 12.0;
    player.dashTimer = 0.25;
    player.dashAnim = 0.35;
  }
  player.handKick = -joy.vx * HAND_KICK_MAX;
  player.shake = Math.max(player.shake, 0.3);
});

onPress(btns.fist, ()=>{
  if (transitionActive) return;
  if (act3 && bossPhase === 'hurt') return;
  if (act3 && bossPhase === 'f1' && molten.alive && molten.mode === 'talk') return;
  if (act4 && (act4Phase === 'talk' || act4Phase === 'hurt_talk' || act4Phase === 'f2_transition')) return;

  if (act2 || act3 || act4) {
    player.fistAnim = 0.25;
    lineCounter = (lineCounter % 4) + 1;
    spawnLine(lineCounter);
    playSnap();
    if (act4 && act4Phase === 'f1' && saimon.alive && saimon.state !== 'retreat') {
      startSaimonRetreat();
    }
    return;
  }
  if (player.fistAnim <= 0){
    player.fistAnim = HAND_ACTION_DURATION;
    punch(); playSnap();
  }
});

onPress(btns.hook, ()=>{
  if (transitionActive) return;
  if (act2 || act3 || act4) {
    if (!ant.active && ant.cooldown <= 0) {
      ant.active = true;
      ant.timer = ANT_DURATION;
      ant.x = player.x + Math.cos(player.dir) * 1.5;
      ant.y = player.y + Math.sin(player.dir) * 1.5;
      ant.attackCd = 2.0;
      ant.attackAnim = 0;
      if (isWall(ant.x, ant.y)) { ant.x = player.x; ant.y = player.y; }
      playSnap();
    }
    return;
  }
  if (player.hookAnim <= 0){
    player.hookAnim = HAND_ACTION_DURATION;
    player.hookTarget = getHookTarget();
  }
});

function hasLineOfSight(x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.01) return true;
  const steps = Math.ceil(dist / 0.1);
  for (let i = 1; i < steps; i++){
    const t = i / steps;
    if (isWall(x1 + dx*t, y1 + dy*t)) return false;
  }
  return true;
}

function isAimingAt(e){
  const dx = e.x - player.x, dy = e.y - player.y;
  const dist = Math.hypot(dx, dy);
  if (!act2 && !act3 && !act4 && dist > PLAYER_MELEE_RANGE) return false;
  if (!hasLineOfSight(player.x, player.y, e.x, e.y)) return false;
  if (dist < 0.6) return true;
  let a = Math.atan2(dy, dx) - player.dir;
  while (a >  Math.PI) a -= 2*Math.PI;
  while (a < -Math.PI) a += 2*Math.PI;
  const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
  const projScale = H * 0.9;
  const eh = (act2 || act3 || act4) ? ENEMY_HEIGHT_2 : ENEMY_HEIGHT;
  const hpx = (eh / Math.max(0.4, dist)) * projScale;
  const wpx = hpx * 0.45;
  return Math.abs(W/2 - screenX) < wpx * 0.55;
}

function punch(){
  for (const e of enemies){
    if (!e.alive) continue;
    if (!isAimingAt(e)) continue;
    e.hp--;
    e.hitFlash = 0.35;
    if (e.hp <= 0){
      e.alive = false;
      const gain = 1 + Math.floor(Math.random() * 200);
      player.hp = Math.min(player.maxHp, player.hp + gain);
      player.gainText = '+' + gain;
      player.gainTextTimer = 1.5;
    }
  }
}

function getHookTarget(){
  let best = null, bestDot = HOOK_AIM_DOT;
  const fx = Math.cos(player.dir), fy = Math.sin(player.dir);
  for (const e of enemies){
    if (!e.alive) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > HOOK_RANGE || d < 0.1) continue;
    const dot = (dx*fx + dy*fy) / d;
    if (dot > bestDot){ bestDot = dot; best = e; }
  }
  return best;
}

let actx = null;
function playSnap(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    for (let i=0;i<2;i++){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type='square';
      o.frequency.setValueAtTime(2200 - i*400, t + i*0.02);
      o.frequency.exponentialRampToValueAtTime(600, t + i*0.02 + 0.03);
      g.gain.setValueAtTime(0.15, t + i*0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*0.02 + 0.05);
      o.connect(g); g.connect(actx.destination);
      o.start(t + i*0.02); o.stop(t + i*0.02 + 0.06);
    }
  } catch(err){}
}

function isWall(x, y){
  const cx = Math.floor(x), cy = Math.floor(y);
  if (cx<0||cy<0||cx>=MAP_W||cy>=MAP_H) return true;
  const c = map[cy][cx];
  return c === 1 || c === 3 || c === 4;
}

function isWallForEnemy(x, y) {
  const r = 0.3;
  if (isWall(x - r, y - r)) return true;
  if (isWall(x + r, y - r)) return true;
  if (isWall(x - r, y + r)) return true;
  if (isWall(x + r, y + r)) return true;
  return false;
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const l2 = (x2 - x1)**2 + (y2 - y1)**2;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

function project(wx, wy, wz) {
  const dx = wx - player.x;
  const dy = wy - player.y;
  let angle = Math.atan2(dy, dx) - player.dir;
  while(angle > Math.PI) angle -= Math.PI*2;
  while(angle < -Math.PI) angle += Math.PI*2;
  const dist = Math.hypot(dx, dy);
  const depth = dist * Math.cos(angle);
  if (depth <= 0.1) return null;
  const projScale = H * 0.9;
  const horizon = H/2 + pitchPixels + Math.sin(player.bob) * 3;
  const screenX = W/2 + Math.tan(angle) * (W/2) / Math.tan(FOV/2);
  const screenY = horizon + (EYE_H - wz) / depth * projScale;
  return {x: screenX, y: screenY};
}

function isInView(x, y, margin) {
  let a = Math.atan2(y - player.y, x - player.x) - player.dir;
  while (a >  Math.PI) a -= 2*Math.PI;
  while (a < -Math.PI) a += 2*Math.PI;
  return Math.abs(a) < FOV / 2 - (margin || 0);
}

function spawnLine(type) {
  const frontHit = castRay(player.x, player.y, player.dir);
  const forwardDist = Math.min(3.0, frontHit.dist - 0.3);
  const cx = player.x + Math.cos(player.dir) * forwardDist;
  const cy = player.y + Math.sin(player.dir) * forwardDist;
  const rightHit = castRay(cx, cy, player.dir + Math.PI/2);
  const leftHit = castRay(cx, cy, player.dir - Math.PI/2);
  const rx = cx + Math.cos(player.dir + Math.PI/2) * rightHit.dist;
  const ry = cy + Math.sin(player.dir + Math.PI/2) * rightHit.dist;
  const lx = cx + Math.cos(player.dir - Math.PI/2) * leftHit.dist;
  const ly = cy + Math.sin(player.dir - Math.PI/2) * leftHit.dist;
  const Lx = cx + (lx - cx) * 0.35;
  const Ly = cy + (ly - cy) * 0.35;
  const Rx = cx + (rx - cx) * 0.35;
  const Ry = cy + (ry - cy) * 0.35;
  activeLines.push({
    type: type,
    L: {x: Lx, y: Ly},
    R: {x: Rx, y: Ry},
    C: {x: cx, y: cy},
    z1: type === 1 ? 0.5 : (type === 2 ? 2.0 : 0.0),
    z2: type === 1 ? 0.5 : (type === 2 ? 2.0 : 2.4),
    zCenter: type === 1 ? 0.5 : (type === 2 ? 2.0 : 1.2),
    timer: 0,
    hitEnemies: new Set()
  });
}

function moltenPickTeleportSpot() {
  let best = null, bestScore = -999;
  for (let tries = 0; tries < 40; tries++) {
    const rx = 3 + Math.random() * 25;
    const ry = 11 + Math.random() * 8;
    if (isWallForEnemy(rx, ry)) continue;
    const dToPlayer = Math.hypot(rx - player.x, ry - player.y);
    if (dToPlayer < 3.5) continue;
    let a = Math.atan2(ry - player.y, rx - player.x) - player.dir;
    while (a >  Math.PI) a -= 2*Math.PI;
    while (a < -Math.PI) a += 2*Math.PI;
    const inView = Math.abs(a) < FOV / 2;
    const score = (inView ? 15 : 0) + dToPlayer;
    if (score > bestScore) { bestScore = score; best = {x: rx, y: ry}; }
  }
  if (!best) best = {x: 16.0, y: 15.0};
  return best;
}

function updateMolten(dt) {
  if (bossPhase !== 'f1') return;
  if (!molten.alive) return;

  if (molten.mode === 'talk') {
    molten.talkTimer += dt;
    const totalDur = 10.0;
    const perLine = totalDur / MOLTEN_LINES.length;
    const idx = Math.min(MOLTEN_LINES.length - 1, Math.floor(molten.talkTimer / perLine));
    molten.talkIdx = idx;
    if (molten.talkTimer >= totalDur) {
      molten.mode = 'idle';
      molten.attackTimer = 1.0 + Math.random() * 2.0;
      molten.teleportTimer = 4.0 + Math.random() * 1.0;
      molten.moveTimer = 0.4 + Math.random() * 0.6;
      molten.moveDir = 0;
    }
    return;
  }

  if (molten.mode === 'dead') return;

  if (molten.mode === 'teleportOut') {
    molten.fade -= dt * 1.0;
    molten.portal = Math.min(1, molten.portal + dt * 3);
    if (molten.fade <= 0) {
      molten.fade = 0;
      molten.mode = 'teleportIn';
      molten.portalStage = 1;
      molten.portal = 0;
      const spot = moltenPickTeleportSpot();
      molten.x = spot.x;
      molten.y = spot.y;
      molten.teleportTimer = 1.0;
    }
    return;
  }

  if (molten.mode === 'teleportIn') {
    molten.teleportTimer -= dt;
    if (molten.portalStage === 1) molten.portal = Math.min(1, molten.portal + dt * 4);
    if (molten.teleportTimer <= 0) {
      molten.fade = 1;
      molten.mode = 'idle';
      molten.portal = 0;
      molten.portalStage = 2;
      molten.teleportTimer = 4.0 + Math.random() * 1.0;
      molten.attackTimer = 1.0 + Math.random() * 2.0;
    }
    return;
  }

  if (molten.portal > 0 && molten.portalStage === 2) {
    molten.portal -= dt * 1.2;
    if (molten.portal < 0) molten.portal = 0;
  }

  molten.teleportTimer -= dt;
  const dToPlayer = Math.hypot(player.x - molten.x, player.y - molten.y);
  if (dToPlayer < 4.5 && molten.mode !== 'teleportOut' && molten.mode !== 'teleportIn') {
    if (molten.teleportTimer > 2.0) molten.teleportTimer = 1.0 + Math.random() * 1.0;
  }

  if (molten.teleportTimer <= 0 && molten.mode === 'idle') {
    molten.mode = 'teleportOut';
    molten.showBigCube = 0.3;
    return;
  }

  if (molten.showBigCube > 0) molten.showBigCube -= dt;

  if (molten.mode === 'attack') {
    molten.attackAnim -= dt;
    if (molten.attackAnim <= 0) {
      const dx = player.x - molten.x;
      const dy = player.y - molten.y;
      const d = Math.hypot(dx, dy) || 1;
      moltenCubes.push({ x: molten.x, y: molten.y, vx: dx / d * CUBE_SPEED, vy: dy / d * CUBE_SPEED, life: 4.0 });
      molten.mode = 'idle';
      molten.attackTimer = 1.0 + Math.random() * 2.0;
      molten.teleportTimer = Math.max(molten.teleportTimer, 4.0);
    }
    return;
  }

  molten.attackTimer -= dt;
  if (molten.attackTimer <= 0) {
    molten.mode = 'attack';
    molten.attackAnim = 0.4;
    return;
  }

  molten.moveTimer -= dt;
  if (molten.moveTimer <= 0) {
    const r = Math.random();
    if (r < 0.30) molten.moveDir = -1;
    else if (r < 0.60) molten.moveDir = 1;
    else if (r < 0.90) molten.moveDir = 2;
    else molten.moveDir = 0;
    molten.moveTimer = 0.4 + Math.random() * 0.9;
  }

  const mspeed = 1.8;
  if (molten.moveDir === -1) {
    const nx = molten.x - mspeed * dt;
    if (!isWallForEnemy(nx, molten.y)) molten.x = nx;
  } else if (molten.moveDir === 1) {
    const nx = molten.x + mspeed * dt;
    if (!isWallForEnemy(nx, molten.y)) molten.x = nx;
  } else if (molten.moveDir === 2) {
    const dx = player.x - molten.x, dy = player.y - molten.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = molten.x - (dx/d) * mspeed * dt;
    const ny = molten.y - (dy/d) * mspeed * dt;
    if (!isWallForEnemy(nx, molten.y)) molten.x = nx;
    if (!isWallForEnemy(molten.x, ny)) molten.y = ny;
  }

  for (let i = moltenCubes.length - 1; i >= 0; i--) {
    const c = moltenCubes[i];
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.life -= dt;
    if (isWallForEnemy(c.x, c.y) || c.life <= 0) { moltenCubes.splice(i, 1); continue; }
    if (Math.hypot(c.x - player.x, c.y - player.y) < 0.6) {
      player.hp = Math.max(0, player.hp - CUBE_DAMAGE);
      player.shake = Math.max(player.shake, 0.5);
      moltenCubes.splice(i, 1);
    }
  }
}

function smokePickNearPlayerSpot() {
  for (let tries = 0; tries < 30; tries++) {
    const ang = player.dir + (Math.random() - 0.5) * (FOV * 0.7);
    const rad = 2.2 + Math.random() * 2.5;
    const rx = player.x + Math.cos(ang) * rad;
    const ry = player.y + Math.sin(ang) * rad;
    if (isWallForEnemy(rx, ry)) continue;
    if (!isInView(rx, ry, 0.1)) continue;
    return {x: rx, y: ry};
  }
  const fx = player.x + Math.cos(player.dir) * 3.0;
  const fy = player.y + Math.sin(player.dir) * 3.0;
  if (!isWallForEnemy(fx, fy)) return {x: fx, y: fy};
  return {x: player.x + 2, y: player.y};
}

function smokePickFarCubeSpot() {
  for (let tries = 0; tries < 40; tries++) {
    const rx = 3 + Math.random() * 25;
    const ry = 11 + Math.random() * 8;
    if (isWallForEnemy(rx, ry)) continue;
    const d = Math.hypot(rx - player.x, ry - player.y);
    if (d < 3.0) continue;
    if (!isInView(rx, ry, 0.05)) continue;
    return {x: rx, y: ry};
  }
  const ang = player.dir;
  const rx = player.x + Math.cos(ang) * 5;
  const ry = player.y + Math.sin(ang) * 5;
  if (!isWallForEnemy(rx, ry)) return {x: rx, y: ry};
  return {x: player.x + 4, y: player.y};
}

function updateSmoke(dt) {
  if (bossPhase !== 'f2' || !smoke.alive) return;

  smoke.fade = 0.7;

  const dNow = Math.hypot(player.x - smoke.x, player.y - smoke.y);
  if (dNow < SMOKE_TOUCH_RANGE) {
    player.hp = Math.max(0, player.hp - SMOKE_TOUCH_DPS * dt);
    player.shake = Math.max(player.shake, 0.15);
  }

  if (smokeNearPortal.active) {
    smokeNearPortal.life -= dt;
    if (smokeNearPortal.life <= 0) smokeNearPortal.active = false;
  }
  for (let i = smokeFarPortals.length - 1; i >= 0; i--) {
    smokeFarPortals[i].life -= dt;
    if (smokeFarPortals[i].life <= 0) smokeFarPortals.splice(i, 1);
  }

  if (smoke.mode === 'atak') {
    smoke.atakTimer -= dt;
    const dx = player.x - smoke.x, dy = player.y - smoke.y;
    const dd = Math.hypot(dx, dy) || 1;
    const step = 4.0 * dt;
    const nx = smoke.x + (dx/dd) * step;
    const ny = smoke.y + (dy/dd) * step;
    if (!isWallForEnemy(nx, smoke.y)) smoke.x = nx;
    if (!isWallForEnemy(smoke.x, ny)) smoke.y = ny;
    if (Math.hypot(player.x - smoke.x, player.y - smoke.y) < SMOKE_TOUCH_RANGE) {
      player.hp = Math.max(0, player.hp - SMOKE_TOUCH_DPS * dt);
      player.shake = Math.max(player.shake, 0.15);
    }
    if (smoke.atakTimer <= 0) {
      smoke.mode = 'idle';
      smokeEl.src = 'smokemolten.gif';
      smokeEl.dataset.src = 'smokemolten.gif';
      smoke.teleportTimer = SMOKE_TELEPORT_INTERVAL_MIN + Math.random() * (SMOKE_TELEPORT_INTERVAL_MAX - SMOKE_TELEPORT_INTERVAL_MIN);
    }
    return;
  }

  smoke.teleportTimer -= dt;
  if (smoke.teleportTimer <= 0 && smoke.mode === 'idle') {
    const spot = smokePickNearPlayerSpot();
    smokeNearPortal.active = true;
    smokeNearPortal.x = spot.x;
    smokeNearPortal.y = spot.y;
    smokeNearPortal.life = SMOKE_NEAR_PORTAL_LIFE;
    smokeNearPortal.maxLife = SMOKE_NEAR_PORTAL_LIFE;
    smoke.x = spot.x;
    smoke.y = spot.y;
    smokeEl.style.display = 'none';
    smoke.mode = 'atak';
    smoke.atakTimer = SMOKE_ATAKING_DURATION;
    smokeEl.src = 'smokemoltenataking.gif';
    smokeEl.dataset.src = 'smokemoltenataking.gif';
    smokeEl.style.display = 'block';
    return;
  }

  smoke.farCubeTimer -= dt;
  if (smoke.farCubeTimer <= 0) {
    const spot = smokePickFarCubeSpot();
    smokeFarPortals.push({
      x: spot.x, y: spot.y,
      life: SMOKE_FAR_PORTAL_LIFE,
      maxLife: SMOKE_FAR_PORTAL_LIFE,
      hasCube: true
    });
    const dx = player.x - spot.x, dy = player.y - spot.y;
    const d = Math.hypot(dx, dy) || 1;
    const cubSpeed = 3.5;
    smokeCubes.push({
      x: spot.x, y: spot.y,
      vx: dx/d * cubSpeed,
      vy: dy/d * cubSpeed,
      life: 6.0,
      size: SMOKE_CUBE_SIZE_FAR
    });
    smoke.farCubeTimer = SMOKE_FAR_CUBE_MIN + Math.random() * (SMOKE_FAR_CUBE_MAX - SMOKE_FAR_CUBE_MIN);
  }

  if (smoke.mode === 'idle') {
    const dx = player.x - smoke.x, dy = player.y - smoke.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > 1.2) {
      const nx = smoke.x + (dx/d) * SMOKE_CHASE_SPEED * dt;
      const ny = smoke.y + (dy/d) * SMOKE_CHASE_SPEED * dt;
      if (!isWallForEnemy(nx, smoke.y)) smoke.x = nx;
      if (!isWallForEnemy(smoke.x, ny)) smoke.y = ny;
    }
  }

  for (let i = smokeCubes.length - 1; i >= 0; i--) {
    const c = smokeCubes[i];
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.life -= dt;
    if (c.life <= 0 || isWallForEnemy(c.x, c.y)) { smokeCubes.splice(i, 1); continue; }
    if (Math.hypot(c.x - player.x, c.y - player.y) < 0.8) {
      player.hp = Math.max(0, player.hp - SMOKE_CUBE_DAMAGE);
      player.shake = Math.max(player.shake, 0.4);
      smokeCubes.splice(i, 1);
    }
  }
}

  voda.mode = 'idle';
}

function saimonTransitionToF2() {
  act4Phase = 'f2_transition';
  voda.active = true;
  voda.mode = 'moveToBoss';
}

function startVorotPhase() {
  act4Phase = 'f2';
  saimon.alive = false;
  saimonEl.style.display = 'none';
  saimonHandEl.style.display = 'none';
  vorot.alive = true;
  vorot.hp = VOROT_MAX_HP;
  vorot.maxHp = VOROT_MAX_HP;
  vorot.x = saimon.x;
  vorot.y = saimon.y;
  vorot.vodovorotTimer = 1.0;
  vorot.badvodovorotTimer = 1.5;
  vorot._wanderAngle = Math.random() * Math.PI * 2;
  vorot._wanderTimer = 0.5 + Math.random() * 0.8;
  vorotEl.src = 'vorotsaimon.gif';
  vorotEl.dataset.src = 'vorotsaimon.gif';
  vorotEl.style.display = 'block';
  vodovorots.length = 0;
  badvodovorots.length = 0;
  waterOverlay = 1.0;
}

function vorotDie() {
  act4Phase = 'dead';
  vorot.alive = false;
  vorotEl.style.display = 'none';
  vodovorots.length = 0;
  badvodovorots.length = 0;
  player.shake = Math.max(player.shake, 1.0);
}

function vorotFleeStep(dt) {
  if (vorot._wanderTimer === undefined) {
    vorot._wanderTimer = 0;
    vorot._wanderAngle = Math.random() * Math.PI * 2;
  }

  vorot._wanderTimer -= dt;
  if (vorot._wanderTimer <= 0) {
    vorot._wanderAngle = Math.random() * Math.PI * 2;
    vorot._wanderTimer = 0.6 + Math.random() * 0.8;
  }

  let mx = Math.cos(vorot._wanderAngle);
  let my = Math.sin(vorot._wanderAngle);

  const cx = 8.0, cy = 7.5;
  const toCenterX = cx - vorot.x;
  const toCenterY = cy - vorot.y;
  const centerDist = Math.hypot(toCenterX, toCenterY);
  if (centerDist > 0.1) {
    const centerWeight = Math.min(1.0, centerDist / 5.0);
    mx += (toCenterX / centerDist) * centerWeight * 1.2;
    my += (toCenterY / centerDist) * centerWeight * 1.2;
  }

  const step = VOROT_FLEE_SPEED * dt;
  let nx = vorot.x + mx * step;
  let ny = vorot.y + my * step;

  if (isWallForEnemy(nx, ny)) {
    const px = -my, py = mx;
    const side = Math.random() < 0.5 ? 1 : -1;
    nx = vorot.x + px * side * step;
    ny = vorot.y + py * side * step;

    if (isWallForEnemy(nx, ny)) {
      vorot._wanderAngle = Math.random() * Math.PI * 2;
      vorot._wanderTimer = 0.4;
      nx = vorot.x;
      ny = vorot.y;
    }
  }

  vorot.x = nx;
  vorot.y = ny;
  vorot.facing = Math.atan2(player.y - vorot.y, player.x - vorot.x);
}

function spawnVodovorot() {
  vodovorots.push({ x: vorot.x, y: vorot.y, life: VODOVOROT_LIFE });
}

function spawnBadvodovorot() {
  const ang = Math.random() * Math.PI * 2;
  const rad = 1.5 + Math.random() * 1.0;
  let bx = vorot.x + Math.cos(ang) * rad;
  let by = vorot.y + Math.sin(ang) * rad;
  if (isWallForEnemy(bx, by)) { bx = vorot.x; by = vorot.y; }
  badvodovorots.push({ x: bx, y: by, life: BADVODOROT_LIFE });
}

function updateSaimon(dt) {
  if (act4Phase === 'talk') {
    saimonTalkTimer += dt;
    const totalDur = 10.0;
    const perLine = totalDur / SAIMON_LINES.length;
    const idx = Math.min(SAIMON_LINES.length - 1, Math.floor(saimonTalkTimer / perLine));
    saimonTalkIdx = idx;
    if (saimonTalkTimer >= totalDur) {
      act4Phase = 'f1';
      saimonTalkTimer = 0;
    }
    return;
  }

  if (act4Phase === 'f1' && saimon.alive) {
    const dxP = player.x - saimon.x, dyP = player.y - saimon.y;
    const distP = Math.hypot(dxP, dyP) || 1;

    saimon.handCooldown -= dt;
    if (saimon.handAttackAnim > 0) saimon.handAttackAnim -= dt;

    if (saimon.handCooldown <= 0 && distP < SAIMON_HAND_REACH && saimon.state !== 'retreat') {
      saimon.handCooldown = SAIMON_HAND_COOLDOWN;
      saimon.handAttackAnim = 0.6;
      if (distP < SAIMON_HAND_ATTACK_RANGE + 0.6) {
        player.hp = Math.max(0, player.hp - SAIMON_HAND_DAMAGE);
        player.shake = Math.max(player.shake, 0.5);
      }
    }

    if (saimon.state === 'retreat') {
      saimon.retreatTimer -= dt;
      const bx = -dxP / distP;
      const by = -dyP / distP;
      const px = -by, py = bx;
      const mvx = bx + px * saimon.retreatDir * 0.7;
      const mvy = by + py * saimon.retreatDir * 0.7;
      const mlen = Math.hypot(mvx, mvy) || 1;
      const nx = saimon.x + (mvx/mlen) * SAIMON_RETREAT_SPEED * dt;
      const ny = saimon.y + (mvy/mlen) * SAIMON_RETREAT_SPEED * dt;
      if (!isWallForEnemy(nx, saimon.y)) saimon.x = nx;
      if (!isWallForEnemy(saimon.x, ny)) saimon.y = ny;
      if (saimon.retreatTimer <= 0) saimon.state = 'chase';
    } else {
      if (distP > 1.2) {
        const nx = saimon.x + (dxP/distP) * SAIMON_CHASE_SPEED * dt;
        const ny = saimon.y + (dyP/distP) * SAIMON_CHASE_SPEED * dt;
        let moved = false;
        if (!isWallForEnemy(nx, saimon.y)) { saimon.x = nx; moved = true; }
        if (!isWallForEnemy(saimon.x, ny)) { saimon.y = ny; moved = true; }
        if (!moved) {
          const px = -dyP / distP;
          const py = dxP / distP;
          if (!saimon._sideSign || Math.random() < 0.02) {
            saimon._sideSign = Math.random() < 0.5 ? -1 : 1;
          }
          const sx = saimon.x + px * saimon._sideSign * SAIMON_SIDE_SPEED * dt;
          const sy = saimon.y + py * saimon._sideSign * SAIMON_SIDE_SPEED * dt;
          if (!isWallForEnemy(sx, saimon.y)) saimon.x = sx;
          if (!isWallForEnemy(saimon.x, sy)) saimon.y = sy;
        }
      }
    }
    saimon.facing = Math.atan2(dyP, dxP);

    if (saimon.hp <= 150 && !voda.active) {
      saimonStartVoda();
    }

    if (saimon.hp <= 0) {
      act4Phase = 'hurt_talk';
      saimonTalkTimer = 0;
      if (!voda.active) {
        voda.active = true;
        voda.x = 8.0; voda.y = 6.5;
      }
      voda.mode = 'moveToBoss';
      saimonHandEl.style.display = 'none';
    }
    return;
  }

  if (act4Phase === 'hurt_talk') {
    saimonTalkTimer += dt;
    if (voda.active && voda.mode === 'moveToBoss') {
      const dx = saimon.x - voda.x, dy = saimon.y - voda.y;
      const d = Math.hypot(dx, dy);
      if (d > 0.4) {
        const vspd = 2.0;
        voda.x += (dx/d) * vspd * dt;
        voda.y += (dy/d) * vspd * dt;
      } else {
        voda.active = false;
        vodaEl.style.display = 'none';
        saimonEl.src = 'saimonhurt.gif';
        saimonEl.dataset.src = 'saimonhurt.gif';
        saimonTransitionToF2();
      }
    }
    return;
  }

  if (act4Phase === 'f2_transition') {
    waterOverlay = Math.min(1.0, waterOverlay + dt * 0.5);
    if (waterOverlay >= 1.0) {
      saimonEl.style.display = 'none';
      startVorotPhase();
    }
    return;
  }

  if (act4Phase === 'f2' && vorot.alive) {
    vorotFleeStep(dt);

    vorot.vodovorotTimer -= dt;
    if (vorot.vodovorotTimer <= 0) {
      spawnVodovorot();
      vorot.vodovorotTimer = VOROT_SPAWN_MIN + Math.random() * (VOROT_SPAWN_MAX - VOROT_SPAWN_MIN);
    }
    vorot.badvodovorotTimer -= dt;
    if (vorot.badvodovorotTimer <= 0) {
      spawnBadvodovorot();
      vorot.badvodovorotTimer = 2.0 + Math.random() * 1.0;
    }

    for (let i = vodovorots.length - 1; i >= 0; i--) {
      const v = vodovorots[i];
      v.life -= dt;
      if (v.life <= 0) { vodovorots.splice(i, 1); continue; }
      if (Math.hypot(v.x - player.x, v.y - player.y) < VODOVOROT_TOUCH_RANGE) {
        player.hp = Math.max(0, player.hp - VODOVOROT_DAMAGE);
        player.frozenTimer = Math.max(player.frozenTimer, VODOVOROT_FREEZE);
        player.shake = Math.max(player.shake, 0.5);
        vodovorots.splice(i, 1);
      }
    }
    for (let i = badvodovorots.length - 1; i >= 0; i--) {
      const b = badvodovorots[i];
      b.life -= dt;
      if (b.life <= 0) { badvodovorots.splice(i, 1); continue; }
      const dx = b.x - player.x, dy = b.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d < BADVODOROT_PULL_RANGE && d > 0.01) {
        const pull = BADVODOROT_PULL_FORCE * dt;
        const nx = player.x + (dx/d) * pull;
        const ny = player.y + (dy/d) * pull;
        if (!isWall(nx, player.y)) player.x = nx;
        if (!isWall(player.x, ny)) player.y = ny;
      }
      if (d < VODOVOROT_TOUCH_RANGE) {
        player.hp = Math.max(0, player.hp - BADVODOROT_DAMAGE);
        player.shake = Math.max(player.shake, 0.8);
        badvodovorots.splice(i, 1);
      }
    }
    return;
  }
}

let last = performance.now();
function update(dt){
  if (transitionActive) {
    transitionTimer -= dt;
    if (transitionTimer <= 0) {
      transitionActive = false;
      if (pendingAct === 2) startAct2();
      else if (pendingAct === 3) startAct3();
      else if (pendingAct === 4) startAct4();
      pendingAct = 0;
    }
    return;
  }

  if (player.frozenTimer > 0) player.frozenTimer -= dt;

  let fwd = -joy.vy, str = joy.vx;
  const mag = Math.hypot(fwd, str);
  if (mag > 1){ fwd/=mag; str/=mag; }

  let speed = 3.2;
  if ((act2 || act3 || act4) && player.dashTimer > 0) {
    speed = player.dashSpeed;
    player.dashTimer -= dt;
    if (player.dashTimer < 0) player.dashTimer = 0;
  }
  if (player.frozenTimer > 0) { fwd = 0; str = 0; }

  const fx = Math.cos(player.dir), fy = Math.sin(player.dir);
  const sx = -fy, sy = fx;
  const nx = player.x + (fx*fwd + sx*str) * speed * dt;
  const ny = player.y + (fy*fwd + sy*str) * speed * dt;
  if (!isWall(nx, player.y)) player.x = nx;
  if (!isWall(player.x, ny)) player.y = ny;
  player.moving = Math.hypot(fwd, str);
  player.bob += dt * player.moving * 12;

  if (player.dashTimer <= 0 && player.dashSpeed > 0) {
    player.handKick *= Math.exp(-12 * dt);
    if (Math.abs(player.handKick) < 0.4) player.handKick = 0;
  }
  if (player.fistAnim > 0) player.fistAnim -= dt;
  if (player.dashAnim > 0) player.dashAnim -= dt;
  if (player.gainTextTimer > 0) player.gainTextTimer -= dt;
  if (player.shake > 0) player.shake *= Math.exp(-2.5 * dt);

  if (act2) {
    if (player.cameraRolling && boss.alive) player.cameraRoll += dt * 2.0;
    else if (!boss.alive && !player.cameraRolling) {
      player.cameraRoll *= Math.exp(-5 * dt);
      if (Math.abs(player.cameraRoll) < 0.001) { player.cameraRoll = 0; player.cameraRolling = false; }
    }
    if (player.x > 18 && !bossRoomEntered && boss.alive) {
      bossRoomEntered = true;
      dialogActive = true;
      dialogTimer = 2.0;
      player.cameraRolling = true;
    }
    if (dialogTimer > 0) dialogTimer -= dt;

    if (boss.alive) {
      boss.x += boss.dir * boss.speed * dt;
      if (boss.x > 37) { boss.x = 37; boss.dir = -1; }
      if (boss.x < 19) { boss.x = 19; boss.dir = 1; }
      const distToPlayer = Math.hypot(player.x - boss.x, player.y - boss.y);
      if (distToPlayer < 2.5) {
        player.hp = Math.max(0, player.hp - 15 * dt);
        player.shake = Math.max(player.shake, 0.2);
      }
    }
    if (!boss.alive) {
      let anyEnemy = false;
      for (const e of enemies) if (e.alive) { anyEnemy = true; break; }
      if (!anyEnemy) startAct3Transition();
    }
    if (ant.active) updateAnt(dt, boss);
    else if (ant.cooldown > 0) ant.cooldown -= dt;
  }

  if (act3) {
    if (!doorOpened) {
      let anyEnemy = false;
      for (const e of enemies) if (e.alive) { anyEnemy = true; break; }
      if (!anyEnemy) {
        doorOpened = true;
        for (let yy = 0; yy < MAP_H; yy++){
          for (let xx = 0; xx < MAP_W; xx++){
            if (map[yy][xx] === 3) map[yy][xx] = 0;
          }
        }
        player.shake = Math.max(player.shake, 1.0);
      }
    } else {
      if (!bossRoomEntered && player.y > 10) bossRoomEntered = true;
    }

    if (bossPhase === 'f1') updateMolten(dt);
    else if (bossPhase === 'hurt') {
      hurtTalkTimer += dt;
      const totalDur = 10.0;
      const perLine = totalDur / HURT_LINES.length;
      const idx = Math.min(HURT_LINES.length - 1, Math.floor(hurtTalkTimer / perLine));
      hurtTalkIdx = idx;
      if (hurtTalkTimer >= totalDur + 2.0) startOuterPhase();
    } else if (bossPhase === 'outer') {
      outerTimer -= dt;
      player.shake = Math.max(player.shake, 1.8);
      if (outerTimer <= 0) startPhase2();
    } else if (bossPhase === 'f2') updateSmoke(dt);

    if (ant.active) {
      const target = bossPhase === 'f2' ? smoke : molten;
      const alive = bossPhase === 'f2' ? smoke.alive : (bossPhase === 'f1' && molten.alive);
      updateAnt(dt, alive ? target : null);
    } else if (ant.cooldown > 0) ant.cooldown -= dt;
  }

  if (act4) {
    if (!doorOpened) {
      let anyEnemy = false;
      for (const e of enemies) if (e.alive) { anyEnemy = true; break; }
      if (!anyEnemy) {
        doorOpened = true;
        for (let yy = 0; yy < MAP_H; yy++){
          for (let xx = 0; xx < MAP_W; xx++){
            if (map[yy][xx] === 3) map[yy][xx] = 0;
          }
        }
        player.shake = Math.max(player.shake, 1.0);
      }
    } else {
      if (!bossRoomEntered && player.y > 6) {
        bossRoomEntered = true;
        act4Phase = 'talk';
        saimonTalkTimer = 0;
        saimonTalkIdx = 0;
      }
    }

    if (act4Phase === 'talk' || act4Phase === 'f1' || act4Phase === 'hurt_talk' || act4Phase === 'f2_transition' || act4Phase === 'f2') {
      updateSaimon(dt);
    }

    if (ant.active) {
      let target = null;
      if (act4Phase === 'f1' && saimon.alive) target = saimon;
      if (act4Phase === 'f2' && vorot.alive) target = vorot;
      updateAnt(dt, target);
    } else if (ant.cooldown > 0) ant.cooldown -= dt;
  }

  updateLines(dt);

  for (const e of enemies){
    if (!e.alive) continue;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    const angToPlayer = Math.atan2(dy, dx);
    let diff = angToPlayer - e.facing;
    while (diff >  Math.PI) diff -= 2*Math.PI;
    while (diff < -Math.PI) diff += 2*Math.PI;
    e.facing += diff * Math.min(1, dt * 2.5);
    if (e.atkCd > 0) e.atkCd -= dt;
    if (e.atkTime > 0){
      e.atkTime -= dt;
      if (!e.didHit && e.atkTime < ENEMY_ATTACK_DURATION * 0.6){
        const curD = Math.hypot(player.x - e.x, player.y - e.y);
        if (curD < ENEMY_ATTACK_RANGE + ENEMY_HIT_TOLERANCE) player.hp = Math.max(0, player.hp - ENEMY_DAMAGE);
        e.didHit = true;
      }
      if (e.atkTime <= 0) e.didHit = false;
    }
    if (dist < ENEMY_ATTACK_RANGE && e.atkCd <= 0 && e.atkTime <= 0){
      e.atkTime = ENEMY_ATTACK_DURATION;
      e.atkCd = ENEMY_ATTACK_DURATION + 0.8;
      e.didHit = false;
    }
    if (e.atkTime <= 0 && dist > 0.7 && dist < 12){
      const spd = 0.55;
      const nxe = e.x + (dx/dist) * spd * dt;
      const nye = e.y + (dy/dist) * spd * dt;
      if (!isWallForEnemy(nxe, e.y)) e.x = nxe;
      if (!isWallForEnemy(e.x, nye)) e.y = nye;
    }
  }

  checkDoor();
}

function updateAnt(dt, target) {
  ant.timer -= dt;
  if (ant.timer <= 0) { ant.active = false; ant.cooldown = ANT_COOLDOWN_MAX; antEl.style.display = 'none'; return; }
  if (!target) {
    const adx = player.x - ant.x, ady = player.y - ant.y;
    const adist = Math.hypot(adx, ady);
    if (adist > 0.5) {
      ant.x += (adx/adist) * 4.0 * dt;
      ant.y += (ady/adist) * 4.0 * dt;
    }
    return;
  }
  const adx = target.x - ant.x, ady = target.y - ant.y;
  const adist = Math.hypot(adx, ady);
  if (adist > 4.0) {
    ant.x += (adx/adist) * 4.0 * dt;
    ant.y += (ady/adist) * 4.0 * dt;
    if (isWallForEnemy(ant.x, ant.y)) { ant.x -= (adx/adist)*4.0*dt; ant.y -= (ady/adist)*4.0*dt; }
    ant.facing = Math.atan2(ady, adx);
  } else if (adist > 0.1 && ant.attackAnim <= 0) ant.facing = Math.atan2(ady, adx);
  if (ant.attackAnim > 0) ant.attackAnim -= dt;
  else {
    ant.attackCd -= dt;
    if (ant.attackCd <= 0 && adist < 20) {
      ant.attackAnim = 1.0;
      ant.attackCd = 4.0;
      if (act2 && boss.alive) { boss.hp = Math.max(0, boss.hp - 15); if (boss.hp <= 0) boss.alive = false; }
      else if (act3 && bossPhase === 'f1' && molten.alive) { molten.hp = Math.max(0, molten.hp - 15); if (molten.hp <= 0) moltenDie(); }
      else if (act3 && bossPhase === 'f2' && smoke.alive) { smoke.hp = Math.max(0, smoke.hp - 15); if (smoke.hp <= 0) smokeDie(); }
      else if (act4 && act4Phase === 'f1' && saimon.alive) { saimon.hp = Math.max(0, saimon.hp - 20); }
      else if (act4 && act4Phase === 'f2' && vorot.alive) { vorot.hp = Math.max(0, vorot.hp - 20); if (vorot.hp <= 0) vorotDie(); }
    }
  }
}

function updateLines(dt) {
  for (let i = activeLines.length - 1; i >= 0; i--) {
    const line = activeLines[i];
    line.timer += dt;
    if (line.timer > 0.8) { activeLines.splice(i, 1); continue; }
    if (line.timer > 0.05) {
      for (let e of enemies) {
        if (e.alive && !line.hitEnemies.has(e)) {
          let hit = false;
          if (line.type === 1 || line.type === 2) {
            const d = distToSegment(e.x, e.y, line.L.x, line.L.y, line.R.x, line.R.y);
            if (d < 0.4) hit = true;
          } else {
            const pt = line.type === 3 ? line.L : line.R;
            const d = Math.hypot(e.x - pt.x, e.y - pt.y);
            if (d < 0.4) hit = true;
          }
          if (hit) {
            e.hp -= 1;
            e.hitFlash = 0.35;
            line.hitEnemies.add(e);
            if (e.hp <= 0) {
              e.alive = false;
              const gain = 1 + Math.floor(Math.random() * 200);
              player.hp = Math.min(player.maxHp, player.hp + gain);
              player.gainText = '+' + gain;
              player.gainTextTimer = 1.5;
            }
          }
        }
      }
      if (act2 && boss.alive) {
        let hitBoss = false;
        if (line.type === 1 || line.type === 2) {
          if (distToSegment(boss.x, boss.y, line.L.x, line.L.y, line.R.x, line.R.y) < 1.2) hitBoss = true;
        } else {
          const pt = line.type === 3 ? line.L : line.R;
          if (Math.hypot(boss.x - pt.x, boss.y - pt.y) < 1.2) hitBoss = true;
        }
        if (hitBoss && line.timer < 0.2) {
          boss.hp -= BOSS_HIT_DAMAGE;
          player.shake = Math.max(player.shake, 0.4);
          if (boss.hp <= 0) boss.alive = false;
        }
      }
      if (act3 && bossPhase === 'f1' && molten.alive && molten.mode !== 'talk' && molten.mode !== 'teleportOut' && molten.mode !== 'teleportIn' && molten.mode !== 'dead' && molten.fade > 0.3) {
        let hitBoss = false;
        if (line.type === 1 || line.type === 2) {
          if (distToSegment(molten.x, molten.y, line.L.x, line.L.y, line.R.x, line.R.y) < 1.0) hitBoss = true;
        } else {
          const pt = line.type === 3 ? line.L : line.R;
          if (Math.hypot(molten.x - pt.x, molten.y - pt.y) < 1.0) hitBoss = true;
        }
        if (hitBoss && !line.hitEnemies.has(molten)) {
          line.hitEnemies.add(molten);
          molten.hp -= MOLTEN_HIT_DAMAGE;
          player.shake = Math.max(player.shake, 0.4);
          if (molten.hp <= 0) moltenDie();
        }
      }
      if (act3 && bossPhase === 'f2' && smoke.alive) {
        let hitBoss = false;
        if (line.type === 1 || line.type === 2) {
          if (distToSegment(smoke.x, smoke.y, line.L.x, line.L.y, line.R.x, line.R.y) < 1.0) hitBoss = true;
        } else {
          const pt = line.type === 3 ? line.L : line.R;
          if (Math.hypot(smoke.x - pt.x, smoke.y - pt.y) < 1.0) hitBoss = true;
        }
        if (hitBoss && !line.hitEnemies.has(smoke)) {
          line.hitEnemies.add(smoke);
          smoke.hp -= SMOKE_HIT_DAMAGE;
          player.shake = Math.max(player.shake, 0.4);
          if (smoke.hp <= 0) smokeDie();
        }
      }
      if (act4 && act4Phase === 'f1' && saimon.alive) {
        let hitBoss = false;
        if (line.type === 1 || line.type === 2) {
          if (distToSegment(saimon.x, saimon.y, line.L.x, line.L.y, line.R.x, line.R.y) < 1.0) hitBoss = true;
        } else {
          const pt = line.type === 3 ? line.L : line.R;
          if (Math.hypot(saimon.x - pt.x, saimon.y - pt.y) < 1.0) hitBoss = true;
        }
        if (hitBoss && !line.hitEnemies.has(saimon)) {
          line.hitEnemies.add(saimon);
          saimon.hp -= SAIMON_HIT_DAMAGE;
          player.shake = Math.max(player.shake, 0.4);
          if (saimon.hp <= 0) saimon.hp = 0;
        }
      }
      if (act4 && act4Phase === 'f2' && vorot.alive) {
        let hitBoss = false;
        if (line.type === 1 || line.type === 2) {
          if (distToSegment(vorot.x, vorot.y, line.L.x, line.L.y, line.R.x, line.R.y) < 1.0) hitBoss = true;
        } else {
          const pt = line.type === 3 ? line.L : line.R;
          if (Math.hypot(vorot.x - pt.x, vorot.y - pt.y) < 1.0) hitBoss = true;
        }
        if (hitBoss && !line.hitEnemies.has(vorot)) {
          line.hitEnemies.add(vorot);
          vorot.hp -= VOROT_HIT_DAMAGE;
          player.shake = Math.max(player.shake, 0.4);
          if (vorot.hp <= 0) vorotDie();
        }
      }
    }
  }
}

function checkDoor() {
  if (doorOpened) return;
  let anyEnemy = false;
  for (const e of enemies) if (e.alive) { anyEnemy = true; break; }
  if (anyEnemy) return;
  doorOpened = true;
  for (let yy = 0; yy < MAP_H; yy++){
    for (let xx = 0; xx < MAP_W; xx++){
      if (map[yy][xx] === 3) map[yy][xx] = 0;
    }
  }
  player.shake = Math.max(player.shake, 1.0);
}

// ===== ИСПРАВЛЕНИЕ: увеличен шаг луча с 0.02 до 0.08 — в 4 раза меньше итераций.
function castRay(px, py, angle){
  const dx = Math.cos(angle), dy = Math.sin(angle);
  let dist = 0;
  const STEP = 0.08;
  while (dist < 40){
    dist += STEP;
    const x = px + dx*dist, y = py + dy*dist;
    const cx = Math.floor(x), cy = Math.floor(y);
    if (cx<0||cy<0||cx>=MAP_W||cy>=MAP_H) return { dist, cell:1, side:0 };
    const c = map[cy][cx];
    if (c === 1 || c === 3 || c === 4){
      const fracX = x - Math.floor(x), fracY = y - Math.floor(y);
      const side = (fracX < 0.02 || fracX > 0.98) ? 1 : 0;
      return { dist, cell: c, side };
    }
  }
  return { dist: 40, cell: 0, side: 0 };
}

// ===== ИСПРАВЛЕНИЕ: спрайты позиционируются через transform (композитор), а не left/top.
// Также убран filter: brightness(...) из горячего цикла — вспышка показывается сменой src.
function setSpriteBox(el, cx, cy, w, h, z, opacity, flipX){
  // cx,cy — центр в экранных координатах; w,h — размеры.
  const x = cx - w/2;
  const y = cy - h/2;
  const sx = flipX ? -1 : 1;
  el.style.display = 'block';
  el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${sx}, 1)`;
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  el.style.zIndex = z;
  el.style.opacity = opacity;
}

function drawWallStrip(i, colW, horizon, projScale, hit, corr){
  const theme = currentTheme;
  const wallH = getWallHeight(hit.cell);
  const wallHpx = (wallH / Math.max(0.05, corr)) * projScale;
  const floorY  = horizon + (EYE_H / Math.max(0.05, corr)) * projScale;
  const topY    = floorY - wallHpx;

  if (hit.cell !== 4) {
    const ceilingY = topY;
    const ceilingHeight = 1.0;
    const ceilHpx = (ceilingHeight / Math.max(0.05, corr)) * projScale;
    const cs = theme.ceilingShade;
    const ceilShade = Math.max(2, 10 - corr * 2);
    const r = Math.min(255, (cs[0] * ceilShade / 10) | 0);
    const g = Math.min(255, (cs[1] * ceilShade / 10) | 0);
    const b = Math.min(255, (cs[2] * ceilShade / 10) | 0);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(i*colW, ceilingY - ceilHpx, colW+1, ceilHpx);
    if (corr < 15) {
      ctx.fillStyle = theme.fogColor;
      ctx.fillRect(i*colW, ceilingY - 2, colW+1, 2);
    }
  }

  if (hit.cell === 4){
    const STRIPE_H = 2.0;
    const numStripes = Math.ceil(wallH / STRIPE_H);
    for (let s = 0; s < numStripes; s++){
      const sBot = s * STRIPE_H;
      const sTop = Math.min(wallH, (s+1) * STRIPE_H);
      const sBotY = horizon + ((EYE_H - sBot) / Math.max(0.05, corr)) * projScale;
      const sTopY = horizon + ((EYE_H - sTop) / Math.max(0.05, corr)) * projScale;
      const stripeH = sBotY - sTopY;
      const sideMul = hit.side === 1 ? 0.6 : 1.0;
      const base = (s % 2 === 0) ? 70 : 25;
      const shade = Math.max(10, base * sideMul - corr * 5);
      if (s % 2 === 0) {
        const wc = theme.wallSide0;
        ctx.fillStyle = `rgb(${Math.min(255, (wc[0]*shade/70)|0)},${Math.min(255, (wc[1]*shade/70)|0)},${Math.min(255, (wc[2]*shade/70)|0)})`;
      } else {
        const wc = theme.wallSide1;
        ctx.fillStyle = `rgb(${Math.min(255, (wc[0]*shade/25)|0)},${Math.min(255, (wc[1]*shade/25)|0)},${Math.min(255, (wc[2]*shade/25)|0)})`;
      }
      ctx.fillRect(i*colW, sTopY, colW+1, stripeH+0.5);
    }
  } else if (hit.cell === 3){
    const dc = theme.doorColor;
    const shade = Math.max(20, 100 - corr*6);
    ctx.fillStyle = `rgb(${Math.min(255, (dc[0]*shade/100)|0)},${Math.min(255, (dc[1]*shade/100)|0)},${Math.min(255, (dc[2]*shade/100)|0)})`;
    ctx.fillRect(i*colW, topY, colW+1, wallHpx);
  } else {
    const wc = hit.side === 1 ? theme.wallSide1 : theme.wallSide0;
    const shade = Math.max(10, 70 - corr*6);
    ctx.fillStyle = `rgb(${Math.min(255, (wc[0]*shade/70)|0)},${Math.min(255, (wc[1]*shade/70)|0)},${Math.min(255, (wc[2]*shade/70)|0)})`;
    ctx.fillRect(i*colW, topY, colW+1, wallHpx);
  }
}

function drawOuterWorld(horizon, projScale) {

  const pBottom = project(outerWorldX, outerWorldY, 0);
