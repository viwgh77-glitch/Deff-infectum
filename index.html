// ===== ИСПРАВЛЕНИЕ: градиент для порталов создаётся один раз на «форму», а не каждый кадр.
const teleportCubeGradCache = new Map();
function getTeleportGrad(proj, radius, alpha) {
  // Ключ по округлённому радиусу и уровню альфы (чтобы не плодить сотни градиентов)
  const rKey = Math.round(radius / 8) * 8;
  const aKey = Math.round(alpha * 4) / 4;
  const key = rKey + '_' + aKey;
  let g = teleportCubeGradCache.get(key);
  if (!g) {
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, rKey);
    g.addColorStop(0, `rgba(180,180,220,${(0.75 * aKey).toFixed(3)})`);
    g.addColorStop(0.5, `rgba(100,100,150,${(0.45 * aKey).toFixed(3)})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    teleportCubeGradCache.set(key, g);
  }
  return g;
}

function drawTeleportCube(x, y, radiusWorld, alpha) {
  const proj = project(x, y, 1.0);
  if (!proj) return;
  const dx = x - player.x, dy = y - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.01) return;
  const baseR = (radiusWorld * 1.4 / Math.max(0.4, dist)) * (H * 0.9);
  const grad = getTeleportGrad(proj, baseR, alpha);
  ctx.save();
  ctx.translate(proj.x, proj.y);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, baseR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (smokecubeImgEl.complete && smokecubeImgEl.naturalWidth > 0) {
    const cubeH = (radiusWorld * 2.0 / Math.max(0.4, dist)) * (H * 0.9);
    const asp = (smokecubeImgEl.naturalWidth / smokecubeImgEl.naturalHeight) || 1.0;
    const cubeW = cubeH * asp;
    ctx.save();
    ctx.globalAlpha = 0.7 * alpha;
    ctx.drawImage(smokecubeImgEl, proj.x - cubeW/2, proj.y - cubeH/2, cubeW, cubeH);
    ctx.restore();
  }
}

function drawVortexDom(el, x, y, sizeWorld, alpha, colW, numRays, zBuffer, horizon, projScale) {
  const dx = x - player.x;
  const dy = y - player.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.3) { el.style.display = 'none'; return; }

  let a = Math.atan2(dy, dx) - player.dir;
  if (a > Math.PI) a -= Math.PI * 2;
  else if (a < -Math.PI) a += Math.PI * 2;
  if (Math.abs(a) > FOV / 2 + 0.5) { el.style.display = 'none'; return; }

  const screenX = W / 2 + Math.tan(a) * (W / 2) / Math.tan(FOV / 2);
  const colIdx = Math.floor(screenX / colW);
  if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15) {
    el.style.display = 'none';
    return;
  }

  const screenY = horizon + (EYE_H - 1.0) / dist * projScale;
  const hpx = (sizeWorld / dist) * projScale;
  const wpx = hpx;

  setSpriteBox(el, screenX, screenY, wpx, hpx,
               250 - Math.min(100, Math.round(dist * 4)), alpha, false);
}

function drawMoltenSprite(horizon, projScale, colW, numRays, zBuffer) {
  if (bossPhase !== 'f1' || !molten.alive || !bossRoomEntered) { moltenEl.style.display = 'none'; return; }
  const dx = molten.x - player.x, dy = molten.y - player.y;
  const dist = Math.hypot(dx, dy);
  let a = Math.atan2(dy, dx) - player.dir;
  while (a >  Math.PI) a -= 2*Math.PI;
  while (a < -Math.PI) a += 2*Math.PI;
  if (Math.abs(a) > FOV/2 + 0.6) { moltenEl.style.display = 'none'; return; }
  const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
  const colIdx = Math.floor(screenX / colW);
  if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15) { moltenEl.style.display = 'none'; return; }
  if (molten.fade > 0.02) {
    let src = 'molten.gif';
    if (molten.mode === 'attack') src = 'moltenataking.gif';
    else if (molten.showBigCube > 0) src = 'cube.png';
    if (moltenEl.dataset.src !== src) { moltenEl.src = src; moltenEl.dataset.src = src; }
    const hpx = ((MOLTEN_TOP - MOLTEN_BOTTOM) / Math.max(0.4, dist)) * projScale;
    const bottomY = horizon + ((EYE_H - MOLTEN_BOTTOM) / Math.max(0.4, dist)) * projScale;
    const topY = bottomY - hpx;
    const aspect = getAspect(src);
    const wpx = hpx * (aspect > 0.1 ? aspect : MOLTEN_ASPECT);
    setSpriteBox(moltenEl, screenX, topY + hpx/2, wpx, hpx, 60, molten.fade, false);
  } else moltenEl.style.display = 'none';
  if (molten.portal > 0.01) {
    const proj = project(molten.x, molten.y, (MOLTEN_TOP + MOLTEN_BOTTOM) / 2);
    if (proj) {
      const baseR = (0.7 / Math.max(0.4, dist)) * projScale;
      const radius = baseR * molten.portal;
      ctx.save();
      const grad = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, radius);
      grad.addColorStop(0, 'rgba(200,80,255,0.9)');
      grad.addColorStop(0.6, 'rgba(120,30,180,0.7)');
      grad.addColorStop(1, 'rgba(40,0,60,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, radius, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawSmokeSprite(horizon, projScale, colW, numRays, zBuffer) {
  if (bossPhase !== 'f2' || !smoke.alive) { smokeEl.style.display = 'none'; return; }
  const dx = smoke.x - player.x, dy = smoke.y - player.y;
  const dist = Math.hypot(dx, dy);
  let a = Math.atan2(dy, dx) - player.dir;
  while (a >  Math.PI) a -= 2*Math.PI;
  while (a < -Math.PI) a += 2*Math.PI;
  if (smokeNearPortal.active) {
    const pdx = smokeNearPortal.x - player.x, pdy = smokeNearPortal.y - player.y;
    let pa = Math.atan2(pdy, pdx) - player.dir;
    while (pa >  Math.PI) pa -= 2*Math.PI;
    while (pa < -Math.PI) pa += 2*Math.PI;
    if (Math.abs(pa) < FOV/2 + 0.4) {
      const pcolIdx = Math.floor((W/2 + Math.tan(pa) * (W/2) / Math.tan(FOV/2)) / colW);
      const pd = Math.hypot(pdx, pdy);
      if (!(pcolIdx >= 0 && pcolIdx < numRays && zBuffer[pcolIdx] < pd - 0.15)) {
        const lifeRatio = Math.max(0, smokeNearPortal.life / smokeNearPortal.maxLife);
        drawTeleportCube(smokeNearPortal.x, smokeNearPortal.y, 0.9 + 0.3 * (1 - lifeRatio), lifeRatio);
      }
    }
  }
  for (const fp of smokeFarPortals) {
    const pdx = fp.x - player.x, pdy = fp.y - player.y;
    let pa = Math.atan2(pdy, pdx) - player.dir;
    while (pa >  Math.PI) pa -= 2*Math.PI;
    while (pa < -Math.PI) pa += 2*Math.PI;
    if (Math.abs(pa) > FOV/2 + 0.4) continue;
    const psx = W/2 + Math.tan(pa) * (W/2) / Math.tan(FOV/2);
    const pcol = Math.floor(psx / colW);
    const pd = Math.hypot(pdx, pdy);
    if (pcol >= 0 && pcol < numRays && zBuffer[pcol] < pd - 0.15) continue;
    const lifeRatio = Math.max(0, fp.life / fp.maxLife);
    const fadeIn = Math.min(1, (fp.maxLife - fp.life) / 0.3);
    const alpha = Math.min(fadeIn, lifeRatio);
    drawTeleportCube(fp.x, fp.y, 1.4, alpha);
  }
  if (Math.abs(a) < FOV/2 + 0.6) {
    const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
    const colIdx = Math.floor(screenX / colW);
    if (!(colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15)) {
      const src = smokeEl.dataset.src || 'smokemolten.gif';
      const hpx = ((MOLTEN_TOP - MOLTEN_BOTTOM) / Math.max(0.4, dist)) * projScale;
      const bottomY = horizon + ((EYE_H - MOLTEN_BOTTOM) / Math.max(0.4, dist)) * projScale;
      const topY = bottomY - hpx;
      const aspect = getAspect(src);
      const wpx = hpx * (aspect > 0.1 ? aspect : MOLTEN_ASPECT);
      setSpriteBox(smokeEl, screenX, topY + hpx/2, wpx, hpx, 60, smoke.fade, false);
    } else smokeEl.style.display = 'none';
  } else smokeEl.style.display = 'none';
  for (const c of smokeCubes) {
    const cdx = c.x - player.x, cdy = c.y - player.y;
    const cd = Math.hypot(cdx, cdy);
    let ca = Math.atan2(cdy, cdx) - player.dir;
    while (ca >  Math.PI) ca -= 2*Math.PI;
    while (ca < -Math.PI) ca += 2*Math.PI;
    if (Math.abs(ca) > FOV/2 + 0.5) continue;
    const csx = W/2 + Math.tan(ca) * (W/2) / Math.tan(FOV/2);
    const ccol = Math.floor(csx / colW);
    if (ccol >= 0 && ccol < numRays && zBuffer[ccol] < cd - 0.15) continue;
    const proj = project(c.x, c.y, 1.0);
    if (!proj) continue;
    const chpx = (c.size / Math.max(0.4, cd)) * projScale;
    if (smokecubeImgEl.complete && smokecubeImgEl.naturalWidth > 0) {
      const asp = (smokecubeImgEl.naturalWidth / smokecubeImgEl.naturalHeight) || 1.0;
      const cwpx = chpx * asp;
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.drawImage(smokecubeImgEl, proj.x - cwpx/2, proj.y - chpx/2, cwpx, chpx);
      ctx.restore();
    }
  }
}

function drawSaimonWorld(horizon, projScale, colW, numRays, zBuffer) {
  if (!act4) {
    saimonEl.style.display = 'none';
    saimonHandEl.style.display = 'none';
    vodaEl.style.display = 'none';
    vorotEl.style.display = 'none';
    return;
  }

  if (saimon.alive || act4Phase === 'hurt_talk') {
    const src = saimonEl.dataset.src || 'saimon.gif';
    if (isLoaded(src)) {
      const dx = saimon.x - player.x, dy = saimon.y - player.y;
      const dist = Math.hypot(dx, dy);
      let a = Math.atan2(dy, dx) - player.dir;
      while (a >  Math.PI) a -= 2*Math.PI;
      while (a < -Math.PI) a += 2*Math.PI;
      if (Math.abs(a) > FOV/2 + 0.6) { saimonEl.style.display = 'none'; }
      else {
        const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
        const colIdx = Math.floor(screenX / colW);
        if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15) {
          saimonEl.style.display = 'none';
        } else {
          const hpx = ((SAIMON_TOP - SAIMON_BOTTOM) / Math.max(0.4, dist)) * projScale;
          const bottomY = horizon + ((EYE_H - SAIMON_BOTTOM) / Math.max(0.4, dist)) * projScale;
          const topY = bottomY - hpx;
          const aspect = getAspect(src);
          const wpx = hpx * (aspect > 0.1 ? aspect : SAIMON_ASPECT);
          setSpriteBox(saimonEl, screenX, topY + hpx/2, wpx, hpx, 60, 1, false);
        }
      }
    }

    if (act4Phase === 'f1' && isLoaded('saimonchil.gif')) {
      const dirToPlayer = Math.atan2(player.y - saimon.y, player.x - saimon.x);
      const perpX = -Math.sin(dirToPlayer);
      const perpY = Math.cos(dirToPlayer);
      const handOffsetSide = 0.5;
      let handX = saimon.x + perpX * handOffsetSide;
      let handY = saimon.y + perpY * handOffsetSide;
      let handZ = SAIMON_TOP * 0.6;

      if (saimon.handAttackAnim > 0) {
        const t = 1 - (saimon.handAttackAnim / 0.6);
        handX = saimon.x + (player.x - saimon.x) * t * 0.9;
        handY = saimon.y + (player.y - saimon.y) * t * 0.9;
      } else {
        const distP = Math.hypot(player.x - saimon.x, player.y - saimon.y);
        if (distP < SAIMON_HAND_REACH) {
          const reach = 1.0 - distP / SAIMON_HAND_REACH;
          handX = saimon.x + (player.x - saimon.x) * 0.4 * reach;
          handY = saimon.y + (player.y - saimon.y) * 0.4 * reach;
        }
      }

      const hdx = handX - player.x, hdy = handY - player.y;
      const hdist = Math.hypot(hdx, hdy);
      let ha = Math.atan2(hdy, hdx) - player.dir;
      while (ha >  Math.PI) ha -= 2*Math.PI;
      while (ha < -Math.PI) ha += 2*Math.PI;
      if (Math.abs(ha) > FOV/2 + 0.6) {
        saimonHandEl.style.display = 'none';
      } else {
        const hscreenX = W/2 + Math.tan(ha) * (W/2) / Math.tan(FOV/2);
        const hcol = Math.floor(hscreenX / colW);
        if (hcol >= 0 && hcol < numRays && zBuffer[hcol] < hdist - 0.15) {
          saimonHandEl.style.display = 'none';
        } else {
          const aspect = getAspect('saimonchil.gif');
          const hpxH = ((SAIMON_TOP * 0.7 - handZ + SAIMON_TOP * 0.3) / Math.max(0.4, hdist)) * projScale;
          const bottomYH = horizon + ((EYE_H - (handZ - 0.5)) / Math.max(0.4, hdist)) * projScale;
          const topYH = bottomYH - hpxH;
          const wpxH = hpxH * (aspect > 0.1 ? aspect : 1.0);
          setSpriteBox(saimonHandEl, hscreenX, topYH + hpxH/2, wpxH, hpxH, 61, 1, false);
        }
      }
    } else {
      saimonHandEl.style.display = 'none';
    }
  } else {
    saimonEl.style.display = 'none';
    saimonHandEl.style.display = 'none';
  }

  if (voda.active && isLoaded('badvodovorot.gif')) {
    const dx = voda.x - player.x, dy = voda.y - player.y;
    const dist = Math.hypot(dx, dy);
    let a = Math.atan2(dy, dx) - player.dir;
    while (a >  Math.PI) a -= 2*Math.PI;
    while (a < -Math.PI) a += 2*Math.PI;
    if (Math.abs(a) > FOV/2 + 0.6) {
      vodaEl.style.display = 'none';
    } else {
      const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
      const colIdx = Math.floor(screenX / colW);
      if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15) {
        vodaEl.style.display = 'none';
      } else {
        const aspect = getAspect('badvodovorot.gif');
        const hpx = ((1.5 - 0.1) / Math.max(0.4, dist)) * projScale;
        const bottomY = horizon + ((EYE_H - 0.1) / Math.max(0.4, dist)) * projScale;
        const topY = bottomY - hpx;
        const wpx = hpx * (aspect > 0.1 ? aspect : 1.0);
        setSpriteBox(vodaEl, screenX, topY + hpx/2, wpx, hpx, 59, 1, false);
      }
    }
  } else {
    vodaEl.style.display = 'none';
  }

  if (act4Phase === 'f2' && vorot.alive && isLoaded('vorotsaimon.gif')) {
    const dx = vorot.x - player.x, dy = vorot.y - player.y;
    const dist = Math.hypot(dx, dy);
    let a = Math.atan2(dy, dx) - player.dir;
    while (a >  Math.PI) a -= 2*Math.PI;
    while (a < -Math.PI) a += 2*Math.PI;
    if (Math.abs(a) > FOV/2 + 0.6) {
      vorotEl.style.display = 'none';
    } else {
      const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
      const colIdx = Math.floor(screenX / colW);
      if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15) {
        vorotEl.style.display = 'none';
      } else {
        const aspect = getAspect('vorotsaimon.gif');
        const hpx = ((SAIMON_TOP - SAIMON_BOTTOM) / Math.max(0.4, dist)) * projScale;
        const bottomY = horizon + ((EYE_H - SAIMON_BOTTOM) / Math.max(0.4, dist)) * projScale;
        const topY = bottomY - hpx;
        const wpx = hpx * (aspect > 0.1 ? aspect : SAIMON_ASPECT);
        setSpriteBox(vorotEl, screenX, topY + hpx/2, wpx, hpx, 60, 0.7, false);
      }
    }
  } else {
    vorotEl.style.display = 'none';
  }

  for (let i = 0; i < vodovorotPool.length; i++) {
    const el = vodovorotPool[i];
    const v = vodovorots[i];
    if (!v) { el.style.display = 'none'; continue; }
    drawVortexDom(el, v.x, v.y, 1.6, Math.min(1, v.life / 0.3), colW, numRays, zBuffer, horizon, projScale);
  }
  for (let i = 0; i < badvodovorotPool.length; i++) {
    const el = badvodovorotPool[i];
    const b = badvodovorots[i];
    if (!b) { el.style.display = 'none'; continue; }
    drawVortexDom(el, b.x, b.y, 1.6, Math.min(1, b.life / 0.3), colW, numRays, zBuffer, horizon, projScale);
  }
}

function drawMoltenCubes(horizon, projScale, colW, numRays, zBuffer) {
  const aspect = getAspect('cube.png');
  for (const c of moltenCubes) {
    const dx = c.x - player.x, dy = c.y - player.y;
    const dist = Math.hypot(dx, dy);
    let a = Math.atan2(dy, dx) - player.dir;
    while (a >  Math.PI) a -= 2*Math.PI;
    while (a < -Math.PI) a += 2*Math.PI;
    if (Math.abs(a) > FOV/2 + 0.3) continue;
    const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
    const colIdx = Math.floor(screenX / colW);
    if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15) continue;
    const hpx = (CUBE_SIZE / Math.max(0.4, dist)) * projScale;
    const centerZ = 1.2;
    const screenY = horizon + ((EYE_H - centerZ) / Math.max(0.4, dist)) * projScale;
    const wpx = hpx * (aspect > 0.1 ? aspect : 1.0);
    if (isLoaded('cube.png')) ctx.drawImage(preloads['cube.png'], screenX - wpx/2, screenY - hpx/2, wpx, hpx);
    else { ctx.fillStyle = '#c040ff'; ctx.fillRect(screenX - wpx/2, screenY - hpx/2, wpx, hpx); }
  }
}

function render(){
  if (transitionActive) { ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H); return; }

  let shakeX = 0, shakeY = 0;
  if (player.shake > 0.01){
    shakeX = (Math.random() - 0.5) * player.shake * 20;
    shakeY = (Math.random() - 0.5) * player.shake * 20;
  }

  const horizon = H/2 + pitchPixels + Math.sin(player.bob) * 3;
  const projScale = H * 0.9;
  const theme = currentTheme;

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(player.cameraRoll);
  ctx.translate(-W/2, -H/2);
  ctx.translate(shakeX, shakeY);

  // Небо. ===== ИСПРАВЛЕНИЕ: градиент неба кэшируется и пересоздаётся только при resize/смене темы.
  const skyKey = currentTheme.skyTop + '|' + currentTheme.skyBottom + '|' + horizon;
  if (!skyGradCache || skyGradKey !== skyKey) {
    skyGradCache = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGradCache.addColorStop(0, theme.skyTop);
    skyGradCache.addColorStop(1, theme.skyBottom);
    skyGradKey = skyKey;
  }
  ctx.fillStyle = skyGradCache;
  ctx.fillRect(-1000, -1000, W+2000, horizon+1000);

  if (theme.clouds) {
    drawProceduralClouds(horizon, 0, 0, theme);
  }

  const flr = ctx.createLinearGradient(0, horizon, 0, H);
  flr.addColorStop(0, theme.floorTop);
  flr.addColorStop(1, theme.floorBottom);
  ctx.fillStyle = flr; ctx.fillRect(-1000, horizon, W+2000, H - horizon + 1000);

  // ===== ИСПРАВЛЕНИЕ: ограничено число лучей, чтобы не грузить мобильные устройства.
  const numRays = Math.min(260, Math.floor(W / 4));
  const colW = W / numRays;
  const zBuffer = new Float32Array(numRays);

  for (let i = 0; i < numRays; i++){
    const rayAngle = player.dir - FOV/2 + (i/numRays)*FOV;
    const hit = castRay(player.x, player.y, rayAngle);
    const corr = hit.dist * Math.cos(rayAngle - player.dir);
    zBuffer[i] = corr;
    drawWallStrip(i, colW, horizon, projScale, hit, corr);
  }

  if (act2 || act3 || act4) {
    for (let line of activeLines) {
      let p = line.timer < 0.2 ? line.timer / 0.2 : 1;
      let alpha = 1;
      if (line.timer > 0.5) alpha = 1 - (line.timer - 0.5) / 0.3;
      if (alpha <= 0) continue;
      let x1, y1, x2, y2, z1, z2;
      if (line.type === 1 || line.type === 2) {
        x1 = line.C.x + (line.L.x - line.C.x) * p;
        y1 = line.C.y + (line.L.y - line.C.y) * p;
        x2 = line.C.x + (line.R.x - line.C.x) * p;
        y2 = line.C.y + (line.R.y - line.C.y) * p;
        z1 = line.z1; z2 = line.z2;
      } else {
        x1 = line.L.x; y1 = line.L.y; x2 = line.L.x; y2 = line.L.y;
        if (line.type === 4) { x1 = line.R.x; y1 = line.R.y; x2 = line.R.x; y2 = line.R.y; }
        z1 = line.zCenter + (line.z1 - line.zCenter) * p;
        z2 = line.zCenter + (line.z2 - line.zCenter) * p;
      }
      const p1 = project(x1, y1, z1);
      const p2 = project(x2, y2, z2);
      if (p1 && p2) {
        ctx.save();
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  for (let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    const el = enemyEls[i];
    if (!e.alive){ el.style.display = 'none'; continue; }
    const dx = e.x - player.x, dy = e.y - player.y;
    const dist = Math.hypot(dx, dy);
    let a = Math.atan2(dy, dx) - player.dir;
    while (a >  Math.PI) a -= 2*Math.PI;
    while (a < -Math.PI) a += 2*Math.PI;
    if (Math.abs(a) > FOV/2 + 0.3){ el.style.display = 'none'; continue; }
    const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
    const colIdx = Math.floor(screenX / colW);
    if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15){ el.style.display = 'none'; continue; }
    const eh = (act2 || act3 || act4) ? ENEMY_HEIGHT_2 : ENEMY_HEIGHT;
    const hpx = (eh / Math.max(0.4, dist)) * projScale;
    const floorY = horizon + (EYE_H / Math.max(0.4, dist)) * projScale;
    const topY = floorY - hpx;
    // ИСПРАВЛЕНИЕ: вместо filter:brightness(...) — src на вспышку не меняем (нет ресурсов), просто alpha.
    // Здесь у врага один gif, поэтому «вспышку» делаем через opacity.
    const src = 'vpered.gif';
    if (el.dataset.src !== src){ el.src = src; el.dataset.src = src; }
    const aspect = getAspect(src);
    const wpx = hpx * aspect;
    const fade = Math.max(0.35, Math.min(1, 1.6 - dist * 0.10));
    const opacity = (e.hitFlash > 0 ? 1.0 : fade);
    setSpriteBox(el, screenX, topY + hpx/2, wpx, hpx,
                 200 - Math.min(100, Math.round(dist * 4)), opacity, false);
  }

  if ((act2 || act3 || act4) && ant.active && isLoaded(ant.attackAnim > 0 ? 'antaka.gif' : 'ant.gif')) {
    const dx = ant.x - player.x, dy = ant.y - player.y;
    const dist = Math.hypot(dx, dy);
    let a = Math.atan2(dy, dx) - player.dir;
    while (a >  Math.PI) a -= 2*Math.PI;
    while (a < -Math.PI) a += 2*Math.PI;
    if (Math.abs(a) <= FOV/2 + 0.3) {
      const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
      const colIdx = Math.floor(screenX / colW);
      let visible = true;
      if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] < dist - 0.15) visible = false;
      if (visible) {
        const hpx = (ANT_HEIGHT / Math.max(0.4, dist)) * projScale;
        const floorY = horizon + (EYE_H / Math.max(0.4, dist)) * projScale;
        const topY = floorY - hpx;
        let src = ant.attackAnim > 0 ? 'antaka.gif' : 'ant.gif';
        if (antEl.dataset.src !== src) { antEl.src = src; antEl.dataset.src = src; }
        const aspect = getAspect(src);
        const wpx = hpx * aspect;
        const fade = Math.max(0.35, Math.min(1, 1.6 - dist * 0.10));
        setSpriteBox(antEl, screenX, topY + hpx/2, wpx, hpx,
                     200 - Math.min(100, Math.round(dist * 4)), fade, false);
      } else antEl.style.display = 'none';
    } else antEl.style.display = 'none';
  } else if (antEl) antEl.style.display = 'none';

  if (act2) {
    if (boss.alive && bossRoomEntered) {
      const bossSrc = 'mobius.gif';
      if (isLoaded(bossSrc)) {
        const bdx = boss.x - player.x, bdy = boss.y - player.y;
        const bdist = Math.hypot(bdx, bdy);
        let ba = Math.atan2(bdy, bdx) - player.dir;
        while (ba >  Math.PI) ba -= 2*Math.PI;
        while (ba < -Math.PI) ba += 2*Math.PI;
        if (Math.abs(ba) <= FOV/2 + 0.6) {
          const screenX = W/2 + Math.tan(ba) * (W/2) / Math.tan(FOV/2);
          const bhpx = ((BOSS_TOP - BOSS_BOTTOM) / Math.max(0.4, bdist)) * projScale;
          const bottomY = horizon + ((EYE_H - BOSS_BOTTOM) / Math.max(0.4, bdist)) * projScale;
          const topY = bottomY - bhpx;
          const aspect = getAspect(bossSrc);
          const wpx = bhpx * (aspect > 0.1 ? aspect : BOSS_ASPECT);
          setSpriteBox(bossEl, screenX, topY + bhpx/2, wpx, bhpx, 50, 1, boss.dir < 0);
          if (bossEl.dataset.src !== bossSrc) { bossEl.src = bossSrc; bossEl.dataset.src = bossSrc; }
        } else bossEl.style.display = 'none';
      }
    } else bossEl.style.display = 'none';
  } else if (bossEl.parentNode) bossEl.style.display = 'none';

  if (act3) {
    if (bossPhase === 'f1') drawMoltenSprite(horizon, projScale, colW, numRays, zBuffer);
    else if (moltenEl.parentNode) moltenEl.style.display = 'none';

    if (bossPhase === 'outer') drawOuterWorld(horizon, projScale);

    if (bossPhase === 'hurt') {
      if (isLoaded('moltenhurt.png')) {
        const dx = molten.x - player.x, dy = molten.y - player.y;
        const dist = Math.hypot(dx, dy);
        let a = Math.atan2(dy, dx) - player.dir;
        while (a >  Math.PI) a -= 2*Math.PI;
        while (a < -Math.PI) a += 2*Math.PI;
        if (Math.abs(a) <= FOV/2 + 0.6) {
          const screenX = W/2 + Math.tan(a) * (W/2) / Math.tan(FOV/2);
          const hpx = ((MOLTEN_TOP * 1.3 - MOLTEN_BOTTOM) / Math.max(0.4, dist)) * projScale;
          const bottomY = horizon + ((EYE_H - MOLTEN_BOTTOM) / Math.max(0.4, dist)) * projScale;
          const topY = bottomY - hpx;
          const aspect = getAspect('moltenhurt.png');
          const wpx = hpx * (aspect > 0.1 ? aspect : MOLTEN_ASPECT);
          if (smokeEl.dataset.src !== 'moltenhurt.png') { smokeEl.src = 'moltenhurt.png'; smokeEl.dataset.src = 'moltenhurt.png'; }
          setSpriteBox(smokeEl, screenX, topY + hpx/2, wpx, hpx, 70, 1, false);
        } else smokeEl.style.display = 'none';
      }
    } else if (bossPhase !== 'f2') {
      if (smokeEl.style.display === 'block' && smokeEl.dataset.src === 'moltenhurt.png') smokeEl.style.display = 'none';
    }

    if (bossPhase === 'f2') drawSmokeSprite(horizon, projScale, colW, numRays, zBuffer);
    else if (bossPhase !== 'hurt') { if (smokeEl.parentNode) smokeEl.style.display = 'none'; }

    if (bossPhase === 'f1') drawMoltenCubes(horizon, projScale, colW, numRays, zBuffer);
  } else {
    if (moltenEl.parentNode) moltenEl.style.display = 'none';
    if (smokeEl.parentNode) smokeEl.style.display = 'none';
  }

  if (act4) drawSaimonWorld(horizon, projScale, colW, numRays, zBuffer);
  else {
    if (saimonEl.parentNode) saimonEl.style.display = 'none';
    if (saimonHandEl.parentNode) saimonHandEl.style.display = 'none';
    if (vodaEl.parentNode) vodaEl.style.display = 'none';
    if (vorotEl.parentNode) vorotEl.style.display = 'none';
    for (const el of vodovorotPool) el.style.display = 'none';
    for (const el of badvodovorotPool) el.style.display = 'none';
  }

  ctx.restore();

  if (act4 && waterOverlay > 0.001) {
    ctx.save();
    ctx.fillStyle = `rgba(10, 30, 80, ${waterOverlay * 0.55})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  updateHand(shakeX, shakeY);

  let aimingAny = false;
  for (const e of enemies){ if (e.alive && isAimingAt(e)){ aimingAny = true; break; } }
  ctx.fillStyle = aimingAny ? '#a060c0' : '#c0b0d0';
  ctx.beginPath();
  ctx.arc(W/2, H/2, aimingAny ? 4 : 2.5, 0, Math.PI*2);
  ctx.fill();

  if (joy.active){
    ctx.strokeStyle = 'rgba(100,60,120,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, joy.R, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(40,20,60,0.3)';
    ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, joy.R, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(180,150,200,0.8)';
    ctx.beginPath(); ctx.arc(joy.x, joy.y, joy.r, 0, Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = '#c0b0d0';
  ctx.font = '14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('ТЕРПЕНИЕ ' + Math.floor(player.hp), 12, 22);

  if (act2 || act3 || act4) {
    if (ant.active) { ctx.fillStyle = '#80ff80'; ctx.fillText(`ANT: ${Math.ceil(ant.timer)}c`, 12, 42); }
    else if (ant.cooldown > 0) { ctx.fillStyle = '#806080'; ctx.fillText(`ANT CD: ${Math.ceil(ant.cooldown)}c`, 12, 42); }
    else { ctx.fillStyle = '#80ff80'; ctx.fillText('ANT: ГОТОВ', 12, 42); }
  }

  if (player.frozenTimer > 0) {
    ctx.fillStyle = '#60c0ff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`ЗАМОРОЖЕН ${Math.ceil(player.frozenTimer)}c`, 12, 62);
  }

  if (act2 && boss.alive && bossRoomEntered) {
    const barW = Math.min(300, W * 0.6), barH = 10;
    const barX = (W - barW) / 2, barY = 20;
    ctx.fillStyle = 'rgba(40, 20, 50, 0.7)'; ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
    ctx.strokeStyle = '#a060c0'; ctx.lineWidth = 1; ctx.strokeRect(barX - 2, barY - 2, barW + 4, barH + 4);
    const hpRatio = Math.max(0, boss.hp / boss.maxHp);
    ctx.fillStyle = '#c060c0'; ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('INVERTOR', W / 2, barY - 6); ctx.textAlign = 'left';
  }
  if (act3 && bossPhase === 'f1' && molten.alive && bossRoomEntered) {
    const barW = Math.min(300, W * 0.6), barH = 10;
    const barX = (W - barW) / 2, barY = 20;
    ctx.fillStyle = 'rgba(50, 20, 10, 0.7)'; ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
    ctx.strokeStyle = '#ff6020'; ctx.lineWidth = 1; ctx.strokeRect(barX - 2, barY - 2, barW + 4, barH + 4);
    const hpRatio = Math.max(0, molten.hp / molten.maxHp);
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#ff8020'); grad.addColorStop(1, '#ff2020');
    ctx.fillStyle = grad; ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('ABZES OF FIRE', W / 2, barY - 6); ctx.textAlign = 'left';
  }
  if (act3 && bossPhase === 'f2' && smoke.alive) {
    const barW = Math.min(300, W * 0.6), barH = 10;
    const barX = (W - barW) / 2, barY = 20;
    ctx.fillStyle = 'rgba(30, 30, 30, 0.7)'; ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
    ctx.strokeStyle = '#9090b0'; ctx.lineWidth = 1; ctx.strokeRect(barX - 2, barY - 2, barW + 4, barH + 4);
    const hpRatio = Math.max(0, smoke.hp / smoke.maxHp);
    ctx.fillStyle = '#a0a0c0'; ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('ABZES OF SMOKE', W / 2, barY - 6); ctx.textAlign = 'left';
  }
  if (act4 && bossRoomEntered && (act4Phase === 'f1' || act4Phase === 'hurt_talk') && saimon.alive) {
    const barW = Math.min(300, W * 0.6), barH = 10;
    const barX = (W - barW) / 2, barY = 20;
    ctx.fillStyle = 'rgba(20, 40, 60, 0.7)'; ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
    ctx.strokeStyle = '#4090d0'; ctx.lineWidth = 1; ctx.strokeRect(barX - 2, barY - 2, barW + 4, barH + 4);
    const hpRatio = Math.max(0, saimon.hp / saimon.maxHp);
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#40a0ff'); grad.addColorStop(1, '#2060c0');
    ctx.fillStyle = grad; ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('ABZES OF FIRE', W / 2, barY - 6); ctx.textAlign = 'left';
  }
  if (act4 && act4Phase === 'f2' && vorot.alive) {
    const barW = Math.min(300, W * 0.6), barH = 10;
    const barX = (W - barW) / 2, barY = 20;
    ctx.fillStyle = 'rgba(20, 40, 60, 0.7)'; ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
    ctx.strokeStyle = '#4080b0'; ctx.lineWidth = 1; ctx.strokeRect(barX - 2, barY - 2, barW + 4, barH + 4);
    const hpRatio = Math.max(0, vorot.hp / vorot.maxHp);
    ctx.fillStyle = '#5090c0'; ctx.fillRect(barX, barY, barW * hpRatio, barH);
    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('VOROT', W / 2, barY - 6); ctx.textAlign = 'left';
  }

  if (player.gainTextTimer > 0){
    ctx.fillStyle = '#a060c0'; ctx.font = 'bold 18px monospace';
    ctx.fillText(player.gainText, 165, 23);
  }

  if (act2 && dialogTimer > 0) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(20, H - 100, 250, 70);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c0b0d0'; ctx.font = 'bold 14px monospace';
    ctx.fillText('mobius', 30, H - 75);
    ctx.fillStyle = '#ffffff'; ctx.font = '14px monospace';
    ctx.fillText('WHAT U MEEN HELLO', 30, H - 50);
  }
  if (act3 && bossPhase === 'f1' && molten.alive && molten.mode === 'talk') {
    const boxW = Math.min(400, W - 40), boxH = 64;
    const bx = 20, by = H - 90;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(bx, by, boxW, boxH);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff8040'; ctx.font = 'bold 13px monospace';
    ctx.fillText('MOLTEN', bx + 10, by + 18);
    ctx.fillStyle = '#ffffff'; ctx.font = '15px monospace';
    ctx.fillText(MOLTEN_LINES[molten.talkIdx], bx + 10, by + 42);
  }
  if (act3 && bossPhase === 'hurt') {
    const boxW = Math.min(400, W - 40), boxH = 64;
    const bx = 20, by = H - 90;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(bx, by, boxW, boxH);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff8040'; ctx.font = 'bold 13px monospace';
    ctx.fillText('MOLTEN', bx + 10, by + 18);
    ctx.fillStyle = '#ffffff'; ctx.font = '15px monospace';
    ctx.fillText(HURT_LINES[hurtTalkIdx], bx + 10, by + 42);
  }
  if (act4 && act4Phase === 'talk') {
    const boxW = Math.min(400, W - 40), boxH = 64;
    const bx = 20, by = H - 90;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(bx, by, boxW, boxH);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4090ff'; ctx.font = 'bold 13px monospace';
    ctx.fillText('SAIMON', bx + 10, by + 18);
    ctx.fillStyle = '#ffffff'; ctx.font = '15px monospace';
    ctx.fillText(SAIMON_LINES[saimonTalkIdx], bx + 10, by + 42);
  }
  if (act4 && act4Phase === 'hurt_talk') {
    const boxW = Math.min(400, W - 40), boxH = 64;
    const bx = 20, by = H - 90;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(bx, by, boxW, boxH);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4090ff'; ctx.font = 'bold 13px monospace';
    ctx.fillText('SAIMON', bx + 10, by + 18);
    ctx.fillStyle = '#ffffff'; ctx.font = '15px monospace';
    ctx.fillText(SAIMON_HURT_LINE, bx + 10, by + 42);
  }

  if (player.hp <= 0){
    ctx.fillStyle = 'rgba(5,0,10,0.85)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#804090'; ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ТЕРПЕНИЕ SOLO', W/2, H/2);
    ctx.textAlign = 'left';
  }
}

startAct2();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
